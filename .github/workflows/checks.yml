name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run check
      - run: npm run test:policy
      - run: npm run test:ha
      - run: python3 -I tests/test_setup_tools.py
      - run: npm run test:research
      - run: npm run scan
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run package
      - run: npm run package:mute
